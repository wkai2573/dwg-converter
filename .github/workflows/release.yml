name: 打包與發布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 打包
        run: ./build.ps1

      - name: 壓縮
        run: Compress-Archive -Path dist/dwg-converter -DestinationPath dwg-converter-windows-x64.zip

      - name: 發布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dwg-converter-windows-x64.zip --generate-notes

      - name: 上傳成品（手動觸發時）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: dwg-converter-windows-x64
          path: dwg-converter-windows-x64.zip
